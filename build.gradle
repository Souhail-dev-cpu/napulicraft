plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	runs {
		cityTest {
			client()
			name "Napoli city play-test"
			vmArg "-Dnapuli.citytest=true"
			runDir "run-autotest"
		}
		policetest {
			client()
			name "Napoli police test"
			vmArg "-Dnapuli.policetest=true"
			runDir "run-autotest"
		}
		radiotest {
			client()
			name "Napoli radio test"
			vmArg "-Dnapuli.radiotest=true"
			runDir "run-autotest"
		}
		centrotest {
			client()
			name "Napoli centro test"
			vmArg "-Dnapuli.centrotest=true"
			runDir "run-autotest"
		}
		maptest {
			client()
			name "Napoli map test"
			vmArg "-Dnapuli.maptest=true"
			runDir "run-autotest"
		}
		spawntest {
			client()
			name "Napoli spawn test"
			vmArg "-Dnapuli.spawntest=true"
			runDir "run-autotest"
		}
		autotest {
			client()
			name "Napuli auto test"
			vmArg "-Dnapuli.autotest=true"
			runDir "run-autotest"
		}
	}

	mods {
		"napuli" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// MP3 decoding for the songs people drop in napulicraft/canzoni (LGPL-2.1, bundled jar-in-jar)
	include(implementation("javazoom:jlayer:1.0.1"))
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
