plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	runs {
		policeaitest {
			client()
			name "Napuli police navigation test"
			vmArg "-Dnapuli.policeaitest=true"
			runDir "run-autotest"
		}
		kitchentest {
			client()
			name "Napuli kitchen integration test"
			vmArg "-Dnapuli.kitchentest=true"
			runDir "run-autotest"
		}
		motorinotest {
			client()
			name "Napuli multiplayer scooter test"
			vmArg "-Dnapuli.motorinotest=true"
			runDir "run-autotest"
		}
		peppetest {
			client()
			name "Napuli socks merchant test"
			vmArg "-Dnapuli.peppetest=true"
			runDir "run-autotest"
		}
		taxtest {
			client()
			name "Napuli tax visit test"
			vmArg "-Dnapuli.taxtest=true"
			runDir "run-autotest"
		}
		localJobsTest {
			client()
			name "Napoli local jobs play-test"
			vmArg "-Dnapuli.citytest=true"
			vmArg "-Dnapuli.localjobstest=true"
			runDir "run-autotest"
		}
		housingTest {
			client()
			name "Napoli housing and schedules play-test"
			vmArg "-Dnapuli.citytest=true"
			vmArg "-Dnapuli.housingtest=true"
			runDir "run-autotest"
		}
		familiesTest {
			client()
			name "Napoli families play-test"
			vmArg "-Dnapuli.citytest=true"
			vmArg "-Dnapuli.familiestest=true"
			runDir "run-autotest"
		}
		civicTest {
			client()
			name "Napoli households and jobs play-test"
			vmArg "-Dnapuli.citytest=true"
			vmArg "-Dnapuli.civictest=true"
			runDir "run-autotest"
		}
		cityTest {
			client()
			name "Napoli city play-test"
			vmArg "-Dnapuli.citytest=true"
			runDir "run-autotest"
		}
		policetest {
			client()
			name "Napoli police test"
			vmArg "-Dnapuli.policetest=true"
			runDir "run-autotest"
		}
		radiotest {
			client()
			name "Napoli radio test"
			vmArg "-Dnapuli.radiotest=true"
			runDir "run-autotest"
		}
		centrotest {
			client()
			name "Napoli centro test"
			vmArg "-Dnapuli.centrotest=true"
			runDir "run-autotest"
		}
		maptest {
			client()
			name "Napoli map test"
			vmArg "-Dnapuli.maptest=true"
			runDir "run-autotest"
		}
		spawntest {
			client()
			name "Napoli spawn test"
			vmArg "-Dnapuli.spawntest=true"
			runDir "run-autotest"
		}
		autotest {
			client()
			name "Napuli auto test"
			vmArg "-Dnapuli.autotest=true"
			runDir "run-autotest"
		}
	}

	mods {
		"napuli" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// MP3 decoding for the songs people drop in napulicraft/canzoni (LGPL-2.1, bundled jar-in-jar)
	include(implementation("javazoom:jlayer:1.0.1"))
}

// A disposable headless server checks the same code used by dedicated multiplayer servers.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'napuli-test'
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def taxTestLog = layout.projectDirectory.file('run-autotest/logs/latest.log')
tasks.named('runTaxtest') {
	doLast {
		if (!taxTestLog.asFile.exists() || !taxTestLog.asFile.text.contains('[TAXTEST] ALL PASSED')) {
			throw new GradleException('Tax integration test failed; see run-autotest/logs/latest.log')
		}
	}
}

def peppeTestLog = layout.projectDirectory.file('run-autotest/logs/latest.log')
tasks.named('runPeppetest') {
	doLast {
		if (!peppeTestLog.asFile.exists() || !peppeTestLog.asFile.text.contains('[PEPPETEST] ALL PASSED')) {
			throw new GradleException('Socks merchant integration test failed; see run-autotest/logs/latest.log')
		}
	}
}

def motorinoTestLog = layout.projectDirectory.file('run-autotest/logs/latest.log')
tasks.named('runPoliceaitest') {
	doLast {
		if (!motorinoTestLog.asFile.exists() || !motorinoTestLog.asFile.text.contains('[POLICEAITEST] ALL PASSED')) {
			throw new GradleException('Police AI integration test failed; see run-autotest/logs/latest.log')
		}
	}
}
tasks.named('runKitchentest') {
	doLast {
		if (!motorinoTestLog.asFile.exists() || !motorinoTestLog.asFile.text.contains('[KITCHENTEST] ALL PASSED')) {
			throw new GradleException('Kitchen integration test failed; see run-autotest/logs/latest.log')
		}
	}
}
tasks.named('runMotorinotest') {
	doLast {
		def log = motorinoTestLog.asFile
		if (!log.exists() || !log.text.contains('[MOTORINOTEST] ALL PASSED')) {
			throw new GradleException('Multiplayer scooter client test failed; see run-autotest/logs/latest.log')
		}
	}
}
