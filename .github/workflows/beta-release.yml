name: Build and publish beta

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Generate beta version
        id: version
        shell: bash
        run: |
          base_version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          test -n "$base_version"
          version="${base_version}-beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build mod
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash ./gradlew --no-daemon build "-Pversion=$RELEASE_VERSION"

      - name: Upload mod artifact
        uses: actions/upload-artifact@v7
        with:
          name: napulicraft-${{ steps.version.outputs.version }}
          path: build/libs/napulicraft-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Publish GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Beta automatica di Napulicraft compilata da GitHub Actions.

          - Versione: ${RELEASE_VERSION}
          - Riferimento: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Scarica il JAR allegato e inseriscilo nella cartella mods di Minecraft con Fabric e Fabric API.
          EOF

          gh release create "v${RELEASE_VERSION}" \
            "build/libs/napulicraft-${RELEASE_VERSION}.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Napulicraft ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --latest=false
