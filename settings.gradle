pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		// Avoid Maven Central's shared-IP rate limits on CI runners.
		maven {
			name = 'MavenCentralMirror'
			url = 'https://maven-central.storage-download.googleapis.com/maven2/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'napulicraft'
