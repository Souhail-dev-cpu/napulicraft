dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// MP3 decoding for the songs people drop in napulicraft/canzoni (LGPL-2.1, bundled jar-in-jar)
	include(implementation("javazoom:jlayer:1.0.1"))
}

// A disposable headless server checks the same code used by dedicated multiplayer servers.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'napuli-test'
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// Separate disposable multiplayer world; run write and read with the same -PsoakRun.
def soakRun = providers.gradleProperty('soakRun').getOrElse('local')
def soakPhase = providers.gradleProperty('soakPhase').getOrElse('write')
if (!(soakRun ==~ /[A-Za-z0-9_-]+/) || !(soakPhase in ['write', 'read', 'route', 'shopping'])) throw new GradleException('Invalid soak run/phase')
def soakDirectory = layout.projectDirectory.dir(".gradle/soak/${soakRun}")
loom.runs {
	citySoak {
		server()
		source sourceSets.gametest
		runDir ".gradle/soak/${soakRun}"
		vmArg '-Dnapuli.citysoak=true'
		vmArg "-Dnapuli.soak.phase=${soakPhase}"
		vmArg '-Xmx3G'
	}
}
loom.runs {
	districtSoak {
		server()
		source sourceSets.gametest
		runDir ".gradle/soak/${soakRun}"
		vmArg '-Dnapuli.districtsoak=true'
		vmArg "-Dnapuli.soak.phase=${soakPhase}"
		vmArg '-Xmx3G'
	}
}
tasks.named('runDistrictSoak') {
	dependsOn 'prepareCitySoak'
	def directory = soakDirectory
	def phase = soakPhase
	doLast {
		def log = new File(directory.asFile, 'logs/latest.log')
		if (!log.exists() || !log.text.contains("[DISTRICTSOAK] ${phase.toUpperCase()} PASSED")) throw new GradleException("District multiplayer test failed; see ${log}")
	}
}
tasks.register('prepareCitySoak') {
	def directory = soakDirectory
	doLast {
		directory.asFile.mkdirs()
		new File(directory.asFile, 'eula.txt').text = 'eula=true\n'
		new File(directory.asFile, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
enable-status=false
view-distance=2
simulation-distance=2
spawn-protection=0
pause-when-empty-seconds=0
max-tick-time=-1
level-name=city-soak-world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1}],"biome":"minecraft:plains"}
'''
	}
}
tasks.named('runCitySoak') {
	dependsOn 'prepareCitySoak'
	def directory = soakDirectory
	def phase = soakPhase
	doLast {
		def log = new File(directory.asFile, 'logs/latest.log')
		if (!log.exists() || !log.text.contains("[SOAK] ${phase.toUpperCase()} PASSED")) throw new GradleException("Multiplayer soak failed; see ${log}")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def taxTestLog = layout.projectDirectory.file('run-autotest/logs/latest.log')

tasks.register('prepareQolTest') {
    def directory = layout.projectDirectory.dir('.gradle/qol-client').asFile
    doLast {
        directory.mkdirs()
        def options = new File(directory, 'options.txt')
        def text = options.exists() ? options.getText('UTF-8') : ''
        [onboardAccessibility:'false', tutorialStep:'none', renderDistance:'4', simulationDistance:'5', guiScale:'2', maxFps:'60', pauseOnLostFocus:'false', lang:'it_it'].each { key, value ->
            def pattern = java.util.regex.Pattern.compile('(?m)^' + key + ':.*$')
            if (pattern.matcher(text).find()) text = pattern.matcher(text).replaceAll(key + ':' + value)
            else text += "\n${key}:${value}\n"
        }
        options.setText(text, 'UTF-8')
    }
}

tasks.register('preparePhoneTest') {
    def directory = layout.projectDirectory.dir('.gradle/phone-client').asFile
    doLast {
        directory.mkdirs()
        def options = new File(directory, 'options.txt')
        def text = options.exists() ? options.getText('UTF-8') : ''
        [onboardAccessibility:'false', tutorialStep:'none', renderDistance:'4', simulationDistance:'5', guiScale:'2', maxFps:'60', pauseOnLostFocus:'false', lang:'it_it'].each { key, value ->
            def pattern = java.util.regex.Pattern.compile('(?m)^' + key + ':.*$')
            if (pattern.matcher(text).find()) text = pattern.matcher(text).replaceAll(key + ':' + value)
            else text += "\n${key}:${value}\n"
        }
        options.setText(text, 'UTF-8')
    }
}
tasks.named('runPhoneTest') {
    dependsOn 'preparePhoneTest'
    mustRunAfter 'runGameTest'
    def log = layout.projectDirectory.file('.gradle/phone-client/logs/latest.log')
    doLast {
        if (!log.asFile.exists() || !log.asFile.text.contains('[PHONETEST] ALL PASSED'))
            throw new GradleException('Phone client test failed; see .gradle/phone-client/logs/latest.log')
    }
}

